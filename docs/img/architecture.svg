  <!-- NPM -> ui -->
  <path d="M770,460 L330,510" fill="none" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ui -> core (same-origin /api proxy) -->
  <path d="M480,589 L560,589" fill="none" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="580" text-anchor="middle" font-size="9.5" fill="#495057">/api</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#343a40"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1200" fill="#ffffff"/>

  <text x="800" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#212529">MarNar Trader — Architecture (as built)</text>
  <text x="800" y="55" text-anchor="middle" font-size="13" fill="#495057">Solution &amp; data architecture, Sprint 8 — D-24 · 2026-07-17</text>

  <!-- External services row -->
  <g font-size="12">
    <rect x="220" y="80" width="260" height="90" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="1.5"/>
    <text x="350" y="103" text-anchor="middle" font-weight="700" fill="#e8590c">Binance Spot API</text>
    <text x="350" y="122" text-anchor="middle" fill="#5c3a1e">REST + WebSocket</text>
    <text x="350" y="138" text-anchor="middle" fill="#5c3a1e">live / testnet endpoints</text>
    <text x="350" y="154" text-anchor="middle" fill="#5c3a1e">(D-01)</text>

    <rect x="510" y="80" width="260" height="90" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="1.5"/>
    <text x="640" y="103" text-anchor="middle" font-weight="700" fill="#e8590c">GDELT News API</text>
    <text x="640" y="122" text-anchor="middle" fill="#5c3a1e">public headline feed</text>
    <text x="640" y="138" text-anchor="middle" fill="#5c3a1e">numeric derivatives only</text>
    <text x="640" y="154" text-anchor="middle" fill="#5c3a1e">(D-23)</text>

    <rect x="800" y="80" width="260" height="90" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="1.5"/>
    <text x="930" y="103" text-anchor="middle" font-weight="700" fill="#e8590c">Telegram Bot API</text>
    <text x="930" y="122" text-anchor="middle" fill="#5c3a1e">alerts, reports, kill-switch</text>
    <text x="930" y="138" text-anchor="middle" fill="#5c3a1e">/reports_off /reports_on</text>
    <text x="930" y="154" text-anchor="middle" fill="#5c3a1e">(D-17, D-32, D-35)</text>

    <rect x="1090" y="80" width="290" height="90" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="1.5"/>
    <text x="1235" y="103" text-anchor="middle" font-weight="700" fill="#e8590c">GitHub — heldmar/marnar-trader</text>
    <text x="1235" y="122" text-anchor="middle" fill="#5c3a1e">private repo (D-15)</text>
    <text x="1235" y="138" text-anchor="middle" fill="#5c3a1e">Actions CI · Repository-stack source</text>
    <text x="1235" y="154" text-anchor="middle" fill="#5c3a1e">for Portainer redeploys</text>
  </g>

  <!-- Investor browser -->
  <rect x="640" y="195" width="320" height="55" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="800" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#5f3dc4">Investor Browser</text>
  <text x="800" y="235" text-anchor="middle" font-size="11" fill="#5f3dc4">trader.example.com (D-16)</text>

  <!-- Pi host outer -->
  <rect x="40" y="270" width="1520" height="900" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="64" y="298" font-size="15" font-weight="700" fill="#343a40">MarNar Server — Raspberry Pi 4B (D-02)</text>
  <text x="64" y="316" font-size="12" fill="#495057">existing homelab host · data on /mnt/storage USB, no UPS (D-13)</text>

  <!-- Portainer badge -->
  <rect x="1300" y="292" width="230" height="52" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="1415" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#1864ab">Portainer</text>
  <text x="1415" y="327" text-anchor="middle" font-size="10.5" fill="#1864ab">Repository stack, pulls GitHub on redeploy</text>

  <!-- npm-network -->
  <rect x="80" y="380" width="1440" height="650" rx="8" fill="none" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="100" y="402" font-size="12" fill="#868e96" font-style="italic">docker network: npm-network (external)</text>

  <!-- NPM -->
  <rect x="690" y="410" width="280" height="66" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="830" y="431" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1864ab">Nginx Proxy Manager (existing)</text>
  <text x="830" y="447" text-anchor="middle" font-size="10.5" fill="#1864ab">trader.example.com → ui:80</text>
  <text x="830" y="462" text-anchor="middle" font-size="10.5" fill="#1864ab">access-list auth (D-16); core never exposed</text>

  <!-- ui container -->
  <rect x="120" y="510" width="360" height="480" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="300" y="533" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1864ab">ui container</text>
  <text x="300" y="550" text-anchor="middle" font-size="11" fill="#1864ab">nginx + React/TS/Vite SPA · mem ≤ 64MB</text>

  <rect x="145" y="568" width="310" height="34" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="300" y="589" text-anchor="middle" font-size="11">api.ts — same-origin /api proxy client</text>

  <rect x="145" y="612" width="310" height="30" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="300" y="632" text-anchor="middle" font-size="11">Dashboard.tsx — positions, P&amp;L, health</text>

  <rect x="145" y="652" width="310" height="30" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="300" y="672" text-anchor="middle" font-size="11">Activity.tsx — trades, stops, halts, news</text>

  <rect x="145" y="692" width="310" height="30" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="300" y="712" text-anchor="middle" font-size="11">Reports.tsx — daily/weekly archive (D-29)</text>

  <rect x="145" y="732" width="310" height="30" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="300" y="752" text-anchor="middle" font-size="11">Settings.tsx — risk view, Telegram switch (D-32)</text>

  <rect x="145" y="772" width="310" height="46" rx="6" fill="#ffffff" stroke="#1971c2"/>
  <text x="300" y="791" text-anchor="middle" font-size="11">components: EquityChart · TradeBars</text>
  <text x="300" y="806" text-anchor="middle" font-size="11">KillSwitch (halt / halt+close-positions, D-21)</text>

  <!-- core container -->
  <rect x="540" y="510" width="940" height="480" rx="10" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/>
  <text x="1010" y="533" text-anchor="middle" font-size="13.5" font-weight="700" fill="#087f5b">core container</text>
  <text x="1010" y="550" text-anchor="middle" font-size="11" fill="#087f5b">Python 3.12, asyncio + FastAPI · mem ≤ 512MB</text>

  <!-- row 1 -->
  <rect x="560" y="565" width="200" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="660" y="588" text-anchor="middle" font-size="11" font-weight="700">Exchange Gateway</text>
  <text x="660" y="603" text-anchor="middle" font-size="10">live / paper / backtest impls</text>
  <text x="660" y="617" text-anchor="middle" font-size="10">(mode-parity, R-04)</text>

  <rect x="780" y="565" width="200" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="880" y="588" text-anchor="middle" font-size="11" font-weight="700">Market Data Service</text>
  <text x="880" y="603" text-anchor="middle" font-size="10">candles/ticker, pair screener</text>
  <text x="880" y="617" text-anchor="middle" font-size="10">(D-09)</text>

  <rect x="1000" y="565" width="220" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="1110" y="588" text-anchor="middle" font-size="11" font-weight="700">Strategy Engine</text>
  <text x="1110" y="603" text-anchor="middle" font-size="10">Donchian breakout, swing 1d</text>
  <text x="1110" y="617" text-anchor="middle" font-size="10">(D-26); emits intents only</text>

  <rect x="1240" y="565" width="220" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="1350" y="588" text-anchor="middle" font-size="11" font-weight="700">Risk Manager</text>
  <text x="1350" y="603" text-anchor="middle" font-size="10">circuit breakers, non-overridable</text>
  <text x="1350" y="617" text-anchor="middle" font-size="10">(D-06, D-07, D-08, D-21)</text>

  <!-- row 2 -->
  <rect x="560" y="656" width="200" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="660" y="679" text-anchor="middle" font-size="11" font-weight="700">Order Manager</text>
  <text x="660" y="694" text-anchor="middle" font-size="10">idempotent client order ids</text>
  <text x="660" y="708" text-anchor="middle" font-size="10">journal write before network call</text>

  <rect x="780" y="656" width="200" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="880" y="679" text-anchor="middle" font-size="11" font-weight="700">Reconciler</text>
  <text x="880" y="694" text-anchor="middle" font-size="10">startup reconcile vs. exchange</text>
  <text x="880" y="708" text-anchor="middle" font-size="10">no-UPS answer (R-08)</text>

  <rect x="1000" y="656" width="220" height="66" rx="6" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="1110" y="679" text-anchor="middle" font-size="11" font-weight="700">Journal (SQLite, WAL)</text>
  <text x="1110" y="694" text-anchor="middle" font-size="10">orders, fills, positions, events</text>
  <text x="1110" y="708" text-anchor="middle" font-size="10">single RLock-guarded writer</text>

  <rect x="1240" y="656" width="220" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="1350" y="679" text-anchor="middle" font-size="11" font-weight="700">News Ingestor</text>
  <text x="1350" y="694" text-anchor="middle" font-size="10">GDELT → numeric derivatives</text>
  <text x="1350" y="708" text-anchor="middle" font-size="10">(D-23); event-blackout input</text>

  <!-- row 3 -->
  <rect x="780" y="748" width="220" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="890" y="771" text-anchor="middle" font-size="11" font-weight="700">Report Scheduler</text>
  <text x="890" y="786" text-anchor="middle" font-size="10">Telegram + UI archive</text>
  <text x="890" y="800" text-anchor="middle" font-size="10">daily / weekly (D-28, D-29, D-32, D-35)</text>

  <rect x="1020" y="748" width="260" height="66" rx="6" fill="#ffffff" stroke="#087f5b"/>
  <text x="1150" y="771" text-anchor="middle" font-size="11" font-weight="700">FastAPI routes</text>
  <text x="1150" y="786" text-anchor="middle" font-size="10">/api/health · /api/kill-switch</text>
  <text x="1150" y="800" text-anchor="middle" font-size="10">/api/resume · /api/* (D-21)</text>

  <!-- Storage volume -->
  <rect x="120" y="1010" width="1360" height="90" rx="8" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/>
  <text x="800" y="1033" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a5a00">/mnt/storage/marnar-trader (USB drive, D-13) — bind-mounted to core:/data</text>
  <text x="800" y="1052" text-anchor="middle" font-size="11" fill="#8a5a00">journal.db (SQLite, WAL + synchronous=FULL)  ·  candles/*.parquet  ·  paper-account.json  ·  config.yaml</text>
  <text x="800" y="1069" text-anchor="middle" font-size="10.5" fill="#8a5a00">crash-safety: journal write before exchange call, reconcile-first on every boot (§5, docs/ARCHITECTURE.md)</text>

  <!-- Arrows: external -> core -->
  <path d="M350,170 L660,565" fill="none" stroke="#343a40" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M640,170 L1350,656" fill="none" stroke="#343a40" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M890,748 L930,170" fill="none" stroke="#343a40" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M1235,170 L1415,292" fill="none" stroke="#343a40" stroke-width="1.3" marker-end="url(#arrow)"/>


  <path d="M760,598 L780,598" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M980,598 L1000,598" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M1220,598 L1240,598" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M1350,631 L1350,656 L780,689 L780,689" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M760,689 L780,689" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M980,689 L1000,689" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M1240,689 L1220,689" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M890,748 L1000,689" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M1110,748 L1110,722" fill="none" stroke="#087f5b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Journal -> storage -->
  <path d="M1110,722 L1110,1010" fill="none" stroke="#f08c00" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- legend -->
  <g font-size="10.5">
    <rect x="64" y="1130" width="14" height="14" fill="#fff3e0" stroke="#e8590c"/>
    <text x="84" y="1141">External service</text>
    <rect x="210" y="1130" width="14" height="14" fill="#e7f5ff" stroke="#1971c2"/>
    <text x="230" y="1141">Web/UI tier</text>
    <rect x="330" y="1130" width="14" height="14" fill="#e6fcf5" stroke="#087f5b"/>
    <text x="350" y="1141">core service (Python)</text>
    <rect x="490" y="1130" width="14" height="14" fill="#fff9db" stroke="#f08c00"/>
    <text x="510" y="1141">Persistent data (SQLite/Parquet)</text>
    <rect x="710" y="1130" width="14" height="14" fill="#f3f0ff" stroke="#7048e8"/>

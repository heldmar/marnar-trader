[project]
name = "marnar-trader-core"
version = "0.1.0"
description = "MarNar Trader core service — autonomous Binance Spot trading (Sprint 1: foundation)"
requires-python = ">=3.12"
dependencies = [
    "binance-connector>=3.12,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trader*"]

[tool.pytest.ini_options]
markers = [
    "integration: talks to the Binance Spot testnet (needs BINANCE_TESTNET_API_KEY/SECRET)",
]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

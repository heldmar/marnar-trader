name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests
        run: pytest -m "not integration"

  testnet-integration:
    # Binance Spot testnet round-trip: order placed + cancelled, journaled.
    # Requires repo secrets BINANCE_TESTNET_API_KEY/SECRET; skips on forks.
    runs-on: ubuntu-latest
    needs: lint-and-unit
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: core
    env:
      BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests (skips itself if secrets absent)
        run: pytest -m integration

  docker-build:
    # Prove the image builds for the Pi's architecture (arm64).
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build core image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: core
          platforms: linux/arm64
          push: false

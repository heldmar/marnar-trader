# Local-dev overrides: no Pi bind mount, no npm-network, port on localhost.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  core:
    ports:
      - "127.0.0.1:18080:8000"
    networks: !override
      - default
    volumes: !override
      - trader-data-local:/data

  ui:
    ports:
      - "127.0.0.1:18081:80"
    networks: !override
      - default

volumes:
  trader-data-local: {}

networks:
  npm-network:
    external: false

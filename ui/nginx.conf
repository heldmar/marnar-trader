# MarNar Trader UI — static SPA + same-origin /api proxy to the core service.
# The core container is never exposed publicly; the reverse proxy routes here
# (with its auth/access list, D-16), and this proxy is the only path to core.
# QA1-03: this file IS the public attack-surface definition — defaults are
# deliberate, not inherited.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # Request bodies are tiny JSON (config PUT); make the bound deliberate.
    client_max_body_size 64k;

    # JSON payloads (equity series, timeline) compress ~10x.
    gzip on;
    gzip_types application/json text/css application/javascript;

    # SPA: any unknown path serves the app shell.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        # Only the methods the API actually uses may pass.
        limit_except GET POST PUT { deny all; }

        # Re-resolve `core` per request via Docker's embedded DNS. With a
        # literal hostname in proxy_pass, nginx resolves ONCE at startup and
        # caches the IP forever — so recreating only the core container
        # (e.g. `compose up -d --build core`) leaves this proxy pointed at a
        # dead address and every /api call 502s until the UI is restarted.
        # That is exactly what happened 2026-08-04. Using a variable forces
        # runtime resolution; $request_uri is required because a variable in
        # proxy_pass suppresses nginx's normal URI pass-through.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $core_upstream http://core:8000;
        proxy_pass $core_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

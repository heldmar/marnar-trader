# MarNar Trader UI — static SPA + same-origin /api proxy to the core service.
# The core container is never exposed publicly; NPM routes trader.example.com
# here (with its access list, D-16), and this proxy is the only path to core.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: any unknown path serves the app shell.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
